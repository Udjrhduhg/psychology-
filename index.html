<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TORKY — علم النفس المظلم</title>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Cairo:wght@400;700;900&family=Aref+Ruqaa:wght@700&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
<style>:root{--bg:#050404;--ink:#d8cfc8;--dim:#7d726c;--blood:#b3121a;--deep:#3a0508;--line:#2a1214;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:radial-gradient(ellipse at 50% -10%,#2a0508 0,var(--bg) 60%) fixed,var(--bg);color:var(--ink);font-family:'Cairo',Tahoma,sans-serif;line-height:1.9;overflow-x:hidden}
body:after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);z-index:50}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
/* gate */
#gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:flex-start;justify-content:center;padding:6vh 24px 24px;overflow:auto;text-align:center}
#gate .box{max-width:420px;border:1px solid var(--blood);padding:28px 22px;box-shadow:0 0 40px rgba(179,18,26,.3)}
#gate h2{margin:0 0 8px;font-size:22px;color:var(--blood)}
input,select,textarea{width:100%;background:#0b0707;border:1px solid var(--line);color:var(--ink);padding:12px 14px;font:inherit;border-radius:2px;margin:6px 0 14px}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--blood);outline-offset:2px}
button,.btn{display:inline-block;background:var(--blood);color:#fff;border:0;padding:13px 26px;font:900 17px 'Cairo',sans-serif;cursor:pointer;text-decoration:none;border-radius:2px;box-shadow:0 0 22px rgba(179,18,26,.45)}
button:hover,.btn:hover{background:#d3161f}
.err{color:#ff4a52;min-height:26px;margin:8px 0 0}
/* hero */
header{text-align:center;padding:70px 0 40px}
.logo{font-family:'Creepster','Impact',cursive;font-size:clamp(54px,17vw,120px);letter-spacing:.06em;color:var(--blood);margin:0;line-height:1;direction:ltr;text-shadow:0 0 18px rgba(179,18,26,.7),0 6px 0 var(--deep),0 12px 22px #000;animation:flick 6s infinite}
.hero-img{display:block;margin:0 auto -30px;width:min(340px,78vw);aspect-ratio:3/4;object-fit:cover;object-position:center top;-webkit-mask-image:radial-gradient(ellipse 62% 66% at 50% 46%,#000 40%,transparent 100%);mask-image:radial-gradient(ellipse 62% 66% at 50% 46%,#000 40%,transparent 100%);filter:contrast(1.2) saturate(1.1);animation:trem .22s infinite steps(2),flick 7s infinite,jolt 5s infinite}
.skull{font-size:34px;color:var(--ink);opacity:.6;animation:flick 6s infinite}
.logo{position:relative;display:inline-block}
.logo:before,.logo:after{content:attr(data-text);position:absolute;inset:0;overflow:hidden}
.logo:before{color:#fff;text-shadow:none;opacity:0;animation:gl1 3.2s infinite steps(1);clip-path:inset(0 0 60% 0)}
.logo:after{color:#00e0ff;text-shadow:none;opacity:0;animation:gl2 2.6s infinite steps(1);clip-path:inset(55% 0 0 0)}
@keyframes gl1{0%,88%{transform:translate(0);opacity:0}90%{transform:translate(-6px,2px);opacity:.7}94%{transform:translate(5px,-2px);opacity:.7}96%,100%{transform:translate(0);opacity:0}}
@keyframes gl2{0%,80%{transform:translate(0);opacity:0}83%{transform:translate(6px,-1px);opacity:.6}90%{transform:translate(-5px,2px);opacity:.6}93%,100%{transform:translate(0);opacity:0}}
.drip{display:block;margin:0 auto;width:min(420px,80vw);height:60px;overflow:visible}
.drip path{fill:var(--blood);animation:dr 5s ease-in infinite;transform-origin:top}
.drip path:nth-child(2){animation-delay:1.3s}.drip path:nth-child(3){animation-delay:2.6s}
@keyframes dr{0%{transform:scaleY(.2);opacity:0}30%{opacity:1}100%{transform:scaleY(1.6);opacity:0}}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:26px 0 0}
.gal figure{margin:0;text-align:center;border:1px solid var(--line);background:#080505;padding:10px 4px 8px}
.gal svg{width:100%;height:auto;display:block}
.gal figcaption{font-size:13px;color:var(--dim);line-height:1.5;margin-top:4px}
.eyelid{transform-origin:60px 40px;animation:blink 4.5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
.pup{animation:look 7s infinite ease-in-out}
@keyframes look{0%,100%{transform:translateX(0)}30%{transform:translateX(-9px)}60%{transform:translateX(9px)}}
.vein{stroke-dasharray:6 8;animation:flow 2.5s linear infinite}
@keyframes flow{to{stroke-dashoffset:-56}}
.pulse{transform-origin:60px 45px;animation:pul 2s infinite ease-in-out}
@keyframes pul{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.glow{animation:gw 2.4s infinite alternate}
@keyframes gw{from{opacity:.4}to{opacity:1}}
.smile{animation:sm 5s infinite ease-in-out;transform-origin:60px 62px}
@keyframes sm{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.12)}}
@keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.35}94%{opacity:1}96%{opacity:.5}97%{opacity:1}}
.tag{color:var(--dim);margin:18px 0 0;font-size:17px}
h2.s{font-size:26px;font-weight:900;color:var(--ink);margin:50px 0 6px;border-right:4px solid var(--blood);padding-right:12px}
p.sub{color:var(--dim);margin:0 0 20px}
/* books */
.book{border:1px solid var(--line);background:linear-gradient(180deg,#0e0808,#080505);padding:18px 18px 16px;margin-bottom:14px;display:flex;gap:14px;align-items:flex-start;justify-content:space-between}
.book h3{margin:0 0 2px;font-size:19px;color:#f1e6df}
.book p{margin:0;color:var(--dim);font-size:15px;line-height:1.7}
.book button{padding:9px 16px;font-size:15px;white-space:nowrap;flex:none}
.warn{border:1px dashed var(--blood);padding:16px 18px;color:#e8c9c4;background:rgba(179,18,26,.07)}
label{font-weight:700}
.chk{display:flex;gap:10px;align-items:flex-start;margin:4px 0 16px;font-weight:400}
.chk input{width:22px;height:22px;margin:4px 0 0;flex:none;accent-color:var(--blood)}
footer{text-align:center;color:var(--dim);padding:50px 0 40px;font-size:14px}
.wrap{position:relative;z-index:2}
.bg{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.bg .e{position:absolute;width:26px;height:8px;opacity:0;animation:ee 7s infinite}
.bg .e:before,.bg .e:after{content:"";position:absolute;top:0;width:8px;height:8px;border-radius:50%;background:#e0262e;box-shadow:0 0 10px 3px rgba(224,38,46,.8)}
.bg .e:before{left:0}.bg .e:after{right:0}
@keyframes ee{0%,55%,100%{opacity:0}60%,80%{opacity:1}85%{opacity:0}}
.bg .p{position:absolute;bottom:-40px;font-size:28px;color:rgba(179,18,26,.35);animation:rise 14s linear infinite}
@keyframes rise{to{transform:translateY(-110vh) rotate(40deg);opacity:0}}
.geye{width:120px;display:block;margin:0 auto 6px;filter:drop-shadow(0 0 12px rgba(179,18,26,.8))}
.glogo{font-size:clamp(46px,15vw,78px);margin:4px 0 12px}
#gate .box{background:radial-gradient(ellipse at 50% 0,#2a0508,#050404 70%)}
#intro{position:fixed;inset:0;z-index:95;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;animation:intro 5.2s forwards}
#intro .logo{font-size:clamp(64px,22vw,150px)}
.psi{font-size:54px;color:var(--blood);text-shadow:0 0 24px var(--blood);animation:gw 1s infinite alternate}
#intro p{color:var(--dim);margin:6px 0 0}
@keyframes intro{0%{opacity:0}18%{opacity:1}82%{opacity:1}100%{opacity:0}}
@keyframes trem{0%,100%{transform:translate(0,0)}25%{transform:translate(1.5px,-1px)}50%{transform:translate(-1.5px,1px)}75%{transform:translate(1px,1.5px)}}
@keyframes jolt{0%,84%,100%{translate:0 0;rotate:0deg}86%{translate:-8px 3px;rotate:-1.2deg}88%{translate:9px -4px;rotate:1.4deg}90%{translate:-6px 2px;rotate:-.8deg}92%{translate:5px 3px;rotate:.6deg}}
.dang{animation:dang 3s ease-in-out infinite}
@keyframes dang{0%,100%{transform:translateY(-6px)}50%{transform:translateY(10px)}}
.legs{transform-origin:60px 48px;animation:twt .5s infinite alternate}
@keyframes twt{from{transform:scale(1)}to{transform:scale(1.06,.96)}}
.sway{transform-origin:60px 6px;animation:swy 3.5s ease-in-out infinite}
@keyframes swy{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.logo{background:linear-gradient(100deg,#3a0508 0,#b3121a 25%,#ff3a42 50%,#b3121a 75%,#3a0508 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;text-shadow:none;filter:drop-shadow(0 0 12px rgba(179,18,26,.7));animation:flick 6s infinite,flow2 3.5s linear infinite}
.logo:before,.logo:after{-webkit-text-fill-color:currentColor;background:none}
@keyframes flow2{to{background-position:-250% 0}}
.bar{width:min(300px,70vw);height:4px;background:#2a1214;margin:22px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--blood);box-shadow:0 0 12px var(--blood);animation:ld 2.8s ease-in-out forwards}
@keyframes ld{to{width:100%}}
.tick{direction:ltr;overflow:hidden;white-space:nowrap;border-block:1px solid var(--line);margin:0 0 24px;color:var(--blood);font-weight:900;letter-spacing:.18em}
.tick div{display:inline-block;padding:6px 0;animation:tk 24s linear infinite}
@keyframes tk{to{transform:translateX(-50%)}}
.banner{position:relative;margin:30px 0;overflow:hidden}
.banner img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;-webkit-mask-image:radial-gradient(ellipse 75% 75% at 50% 50%,#000 45%,transparent 100%);mask-image:radial-gradient(ellipse 75% 75% at 50% 50%,#000 45%,transparent 100%);animation:kb 14s ease-in-out infinite alternate,flick 8s infinite}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.14) translateX(-10px)}}
.banner span{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-weight:900;font-size:20px;color:var(--ink);text-shadow:0 0 12px #000,0 0 18px var(--blood)}
.quote{border:1px solid var(--line);padding:26px 18px;text-align:center;margin:26px 0;background:#080505;min-height:150px;transition:opacity .8s;display:flex;flex-direction:column;justify-content:center}
.quote.off{opacity:0}
.quote p{font-size:20px;font-weight:700;color:#f1e6df;margin:0 0 8px}
.quote small{color:var(--blood);font-size:15px}
.spin{transform-origin:60px 45px;animation:spn 6s linear infinite}
@keyframes spn{to{transform:rotate(360deg)}}
.shift{animation:sh 2.5s infinite steps(1)}
@keyframes sh{0%,70%{transform:translateX(0)}75%{transform:translateX(5px)}85%{transform:translateX(-3px)}100%{transform:translateX(0)}}
.tear{animation:tr 3s infinite ease-in}
@keyframes tr{0%{transform:translateY(-6px);opacity:0}20%{opacity:1}100%{transform:translateY(20px);opacity:0}}
.vig{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.85) 100%);animation:vg 6s ease-in-out infinite alternate}
@keyframes vg{from{opacity:.7}to{opacity:1}}
#snd{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:120;background:rgba(0,0,0,.6);border:1px solid var(--line);color:var(--ink);padding:6px 10px;font-size:18px;box-shadow:none;border-radius:20px}
.fab{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:16px;z-index:40;background:var(--blood);color:#fff;text-decoration:none;font-weight:900;padding:12px 20px;border-radius:30px;box-shadow:0 0 24px rgba(179,18,26,.7);animation:pul2 2.4s infinite}
@keyframes pul2{50%{box-shadow:0 0 38px rgba(255,58,66,.9)}}
.tr{position:fixed;width:10px;height:10px;margin:-5px;border-radius:50%;background:#b3121a;box-shadow:0 0 12px #b3121a;pointer-events:none;z-index:60;animation:trf .8s forwards}
@keyframes trf{to{transform:scale(.2);opacity:0}}
#scare{position:fixed;inset:0;z-index:200;background:#000;display:flex;align-items:center;justify-content:center;pointer-events:none;animation:sco 1.1s forwards}
#scare svg{height:96vh;max-width:110%;animation:scz 1.1s ease-out,shk .12s infinite;filter:contrast(1.3) drop-shadow(0 0 30px #f00)}
@keyframes sco{0%{opacity:0}10%{opacity:1}72%{opacity:1}100%{opacity:0}}
@keyframes scz{from{transform:scale(.7)}to{transform:scale(1.25)}}
.qz,.ink{border:1px solid var(--line);background:#080505;padding:20px 16px;text-align:center}
.qz p{font-weight:700;font-size:18px;margin:0 0 12px}
.qz button,.chs button{display:block;width:100%;margin:8px 0;background:#120808;border:1px solid var(--blood);box-shadow:none;font-size:16px;padding:11px}
.chs{display:flex;gap:8px}.chs button{margin:6px 0}
.ink svg{width:min(240px,70%);margin:0 auto;display:block}
.book small{color:var(--blood);display:block;margin-top:4px}
.banner svg{display:block;width:100%;height:auto;-webkit-mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,#000 50%,transparent 100%);mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,#000 50%,transparent 100%);animation:flick 8s infinite}
.rl{animation:rch 4s ease-in-out infinite}
@keyframes rch{50%{transform:translateX(18px)}}
.pal{text-align:center;position:relative;margin:0 0 10px}
.pal:before{content:"";position:absolute;top:34px;left:50%;transform:translateX(-50%);width:220px;height:130px;background:radial-gradient(ellipse at top,rgba(255,196,80,.28),transparent 70%);animation:bf 5s infinite;pointer-events:none}
.lamp{width:44px;display:block;margin:0 auto;transform-origin:50% 0;animation:lsw 4s ease-in-out infinite}
.bulb{filter:drop-shadow(0 0 10px #ffb830);animation:bf 5s infinite}
@keyframes lsw{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes bf{0%,89%,100%{opacity:1}90%{opacity:.15}92%{opacity:1}94%{opacity:.35}96%{opacity:1}}
.pt{position:relative;font-weight:900;font-size:22px;color:#ffe6a8;text-shadow:0 0 14px rgba(255,170,60,.75);margin-top:2px;animation:bf 5s infinite}
.pt span{display:block;font-size:12px;letter-spacing:.35em;direction:ltr;color:#d8cfc8;text-shadow:0 0 8px rgba(255,170,60,.5)}
.gold{font-family:'Aref Ruqaa','Cinzel Decorative',serif;font-size:clamp(34px,10vw,54px);font-weight:700;line-height:1.5;background:linear-gradient(100deg,#7a5a14 0,#e8c766 20%,#fff3b8 40%,#d4a62f 60%,#7a5a14 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:gold 3s linear infinite,pop 1s ease-out;filter:drop-shadow(0 0 10px rgba(212,166,47,.55))}
.gold.latin{font-family:'Cinzel Decorative','Aref Ruqaa',serif;font-size:clamp(28px,8vw,44px);letter-spacing:.06em}
@keyframes gold{to{background-position:-250% 0}}
@keyframes pop{from{opacity:0;transform:scale(.6) translateY(12px)}to{opacity:1;transform:none}}
.orn{color:#d4a62f;letter-spacing:.5em;opacity:.85;font-size:16px;animation:gw 2s infinite alternate}
.welcome{margin:14px 0 0}
.wl{margin:8px 0 0;font-size:20px;color:#e8c766;font-weight:700}
.wl span{display:inline-block;font-family:'Aref Ruqaa','Cinzel Decorative',serif;font-size:30px;background:linear-gradient(100deg,#7a5a14 0,#e8c766 20%,#fff3b8 40%,#d4a62f 60%,#7a5a14 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:gold 3s linear infinite;filter:drop-shadow(0 0 8px rgba(212,166,47,.5))}
.wl span.latin{font-family:'Cinzel Decorative',serif;font-size:24px}
.flag{width:62px;display:block;margin:8px auto 0;transform-origin:left center;animation:wave 3s ease-in-out infinite;filter:drop-shadow(0 0 8px rgba(255,255,255,.25))}
@keyframes wave{0%,100%{transform:skewY(-3deg) scaleX(.97)}50%{transform:skewY(3deg) scaleX(1)}}
.dua{margin:6px 0 26px;padding:18px 16px;border:1px solid #6b5316;background:linear-gradient(180deg,#120d05,#080505);text-align:center;box-shadow:0 0 24px rgba(212,166,47,.12)}
.dua p{margin:6px 0;font-family:'Aref Ruqaa','Cairo',serif;font-size:20px;line-height:2;color:#f0dca0}
#intro>:not(.ibg):not(.ibr):not(.isk):not(.ih){position:relative;z-index:1}
.ibg{position:absolute;z-index:0;width:min(560px,135vw);left:50%;top:50%;transform:translate(-50%,-50%);opacity:.5;filter:drop-shadow(0 0 22px rgba(179,18,26,.55))}
.dil{transform-origin:150px 80px;animation:dil 2.4s ease-in-out infinite alternate}
@keyframes dil{from{transform:scale(.7)}to{transform:scale(1.35)}}
.blk{transform-origin:150px 80px;animation:blk2 4s infinite}
@keyframes blk2{0%,90%,100%{transform:scaleY(0)}94%{transform:scaleY(1)}}
.ph{display:block;position:relative;margin:0 auto -30px;width:min(340px,78vw);aspect-ratio:400/557;-webkit-mask-image:radial-gradient(ellipse 49% 55% at 50% 46%,#000 38%,transparent 100%);mask-image:radial-gradient(ellipse 49% 55% at 50% 46%,#000 38%,transparent 100%);filter:sepia(.35) saturate(1.5) hue-rotate(-12deg) contrast(1.25) brightness(1.05);animation:flick 7s infinite}
.ph-in{position:absolute;inset:0;transform-origin:50% 60%;animation:lf 8s infinite}
.ph-in img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
.ph-hand{clip-path:polygon(16% 52%,30% 50%,42% 56%,46% 64%,44% 72%,30% 74%,20% 70%,14% 62%);transform-origin:38% 72%;animation:hd2 8s infinite}
.ph-eye{position:absolute;left:35%;top:22%;width:14%;height:9%;border-radius:50%;background:radial-gradient(circle,rgba(255,40,50,.95),transparent 70%);mix-blend-mode:screen;animation:eg 8s infinite}
@keyframes lf{0%,48%{transform:none;filter:none}49.9%{filter:none}50.0%{filter:brightness(1.25) contrast(1.4) saturate(1.7);transform:translateY(-9px) scale(1.06,1.12) skewX(-5deg) rotate(-2.2deg)}52.6%{transform:translateY(8px) scale(1.02) rotate(2.4deg)}55.2%{transform:translateY(-10px) scale(1.04,1.13) skewX(6deg) rotate(-2.0deg)}57.8%{transform:translateY(7px) scale(1.02) rotate(2.6deg)}60.4%{transform:translateY(-9px) scale(1.06,1.12) skewX(-5deg) rotate(-2.4deg)}63.0%{transform:translateY(9px) scale(1.02,1.1) skewX(4deg) rotate(2.2deg)}65.6%{transform:translateY(-8px) scale(1.08,1.02) skewX(-4deg) rotate(-1.8deg)}68.2%{transform:translateY(6px) scale(1.02) rotate(2.0deg)}70.8%{transform:translateY(-7px) scale(1.08,1.02) skewX(-4deg) rotate(-1.6deg)}73.4%{transform:translateY(5px) scale(1.02) rotate(1.4deg)}76.0%{transform:translateY(-9px) scale(1.06,1.12) skewX(-5deg) rotate(-2.2deg)}78.6%{transform:translateY(8px) scale(1.02) rotate(2.4deg)}80%{transform:none;filter:brightness(1.25) contrast(1.4) saturate(1.7)}82%,100%{transform:none;filter:none}}
@keyframes hd2{0%,100%{transform:none}10%{transform:rotate(-4deg) translate(-2px,1px)}18%{transform:rotate(3deg) translate(2px,-1px)}26%{transform:rotate(-6deg) translate(-4px,2px)}34%{transform:rotate(2deg)}42%{transform:rotate(-3deg)}46%{transform:rotate(-8deg) translate(-4px,-4px)}50%{transform:translate(-20%,-20%) rotate(-32deg) scale(1.1)}54%{transform:translate(-21%,-19%) rotate(-27deg) scale(1.1)}57%{transform:translate(-19%,-21%) rotate(-37deg) scale(1.1)}60%{transform:translate(-21%,-20%) rotate(-29deg) scale(1.1)}63%{transform:translate(-19%,-19%) rotate(-36deg) scale(1.1)}66%{transform:translate(-21%,-21%) rotate(-28deg) scale(1.1)}69%{transform:translate(-20%,-19%) rotate(-35deg) scale(1.1)}72%{transform:translate(-21%,-20%) rotate(-29deg) scale(1.1)}76%{transform:translate(-20%,-20%) rotate(-33deg) scale(1.1)}80%{transform:translate(-20%,-20%) rotate(-32deg) scale(1.1)}86%{transform:none}}
@keyframes eg{0%,48%{opacity:.2;transform:scale(1)}51%,79%{opacity:1;transform:scale(1.7)}84%,100%{opacity:.2;transform:scale(1)}}
.ph-patch{position:absolute;left:8%;top:44%;width:44%;height:36%;border-radius:50%;background:radial-gradient(ellipse,#1d0d08 0,#120806 55%,transparent 76%);filter:blur(7px);opacity:0;animation:pt 8s infinite}
@keyframes pt{0%,47%{opacity:0}51%,81%{opacity:1}86%,100%{opacity:0}}
.ph-grin{position:absolute;left:20%;top:45%;width:36%;height:19%;opacity:0;transform-origin:50% 0;filter:blur(.7px);animation:gr 8s infinite;overflow:visible}
@keyframes gr{0%,48%{opacity:0;transform:scale(.6)}51%,80%{opacity:1;transform:scale(1)}83%,100%{opacity:0;trans
